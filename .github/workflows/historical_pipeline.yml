name: Historical Earthquake Data Load

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  historical-load:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run historical load
        run: |
          python src/historical_load.py

      - name: Verify database creation
        run: |
          ls -la database

      - name: Commit database to repository
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add database/earthquake.db
          git commit -m "Add historical earthquake database" || echo "No changes to commit"
          git push