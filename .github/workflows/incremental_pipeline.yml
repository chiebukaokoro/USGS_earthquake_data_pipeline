name: Earthquake Incremental ETL Pipeline

on:
  schedule:
    # Runs every Monday at 12:00 AM Pacific Time (PST)
    # GitHub Actions uses UTC, so this is 8:00 AM UTC
    - cron: "0 8 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run incremental ETL pipeline
        run: |
          python src/incremental_load.py

      - name: Verify database update
        run: |
          ls -lh database/earthquake.db

      - name: Commit updated database
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add database/earthquake.db
          git commit -m "Update earthquake database incrementally" || echo "No changes"
          git push