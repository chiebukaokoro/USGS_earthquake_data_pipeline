name: Earthquake Incremental ETL Pipeline

on:
  schedule:
    # Runs every Monday at 12:00 AM Pacific Time (PST)
    # GitHub Actions uses UTC, so this is 8:00 AM UTC
    - cron: "0 8 * * 1"

  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run incremental ETL pipeline
        run: |
          python src/incremental_load.py